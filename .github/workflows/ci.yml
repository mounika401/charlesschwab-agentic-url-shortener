name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Test suite (service, orchestrator, end-to-end scenarios)
        run: python -m pytest -q
      - name: Chained demo (greenfield -> brownfield -> ambiguous)
        run: python -m orchestrator demo
      - name: Verify audit trails
        run: for r in runs/2*; do python -m orchestrator verify-audit "$(basename "$r")"; done
